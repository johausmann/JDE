# PLEASE READ THE MAN PAGE BEFORE EDITING THIS FILE!
# https://htmlpreview.github.io/?https://github.com/conformal/spectrwm/blob/master/spectrwm.html
# NOTE: all rgb color values in this file are in hex! see XQueryColor for examples

workspace_limit	= 10


# Window Decoration
border_width		= 3
color_focus		= rgb:BF/61/6A # red
color_focus_maximized	= rgb:BF/61/6A # red
color_unfocus		= rgb:4C/56/6A # brighter black
color_unfocus_maximized	= rgb:4C/56/6A # brighter black
region_padding	= 2
tile_gap		= 4

# Region containment
# Distance window must be dragged/resized beyond the region edge before it is
# allowed outside the region.
# boundary_width 		= 50

# Remove window border when bar is disabled and there is only one window in workspace
disable_border		= 1

# Bar Settings
bar_enabled		= 0
bar_action		= ~/.config/polybar/launch.sh
bar_action_expand	= 1
bar_justify		= center
iconic_enabled	= 0
# maximize_hide_bar	= 0
window_class_enabled	= 1
window_instance_enabled	= 1
window_name_enabled	= 1
verbose_layout		= 1
urgent_enabled		= 1

# Dialog box size ratio when using TRANSSZ quirk; 0.3 < dialog_ratio <= 1.0
dialog_ratio		= 0.6

# Mod key, (Windows key is Mod4) (Apple key on OSX is Mod2)
modkey = Mod4

# This allows you to include pre-defined key bindings for your keyboard layout.
# keyboard_mapping = ~/.spectrwm_us.conf

# PROGRAMS

# Validated default programs:
program[lock]		= xset s activate
program[term]		= alacritty
program[menu]       = rofi -show drun -icon-theme "Papirus" -show-icons
program[screenshot] = flameshot gui
program[quitrofi]   = ~/.config/rofi/powermenu/type-2/powermenu.sh


# To disable validation of the above, free the respective binding(s):
# bind[]		= MOD+Shift+Delete	# disable lock
# bind[]		= MOD+Shift+Return	# disable term
# bind[]		= MOD+p			# disable menu
bind[] = MOD+Shift+Q

# EXAMPLE: Define 'firefox' action and bind to key.
# program[firefox]	= firefox http://spectrwm.org/
# bind[firefox]		= MOD+Shift+b
bind[screenshot] = MOD + Shift + P
bind[lock] = MOD + Shift + L
bind[quitrofi] = MOD+Shift+Q
bind[menu] = MOD+d

program[sound_increase] =       pactl set-sink-volume @DEFAULT_SINK@ +10%
bind[sound_increase]    =       XF86AudioRaiseVolume

program[sound_decrease] =       pactl set-sink-volume @DEFAULT_SINK@ -10%
bind[sound_decrease]    =       XF86AudioLowerVolume

program[sound_mute] =       pactl set-sink-mute @DEFAULT_SINK@ toggle
bind[sound_mute]    =       XF86AudioMute

program[brightness_increase] =       brightnessctl set +10
bind[brightness_increase]    =       XF86MonBrightnessUp

program[brightness_decrease] =       brightnessctl set 10-
bind[brightness_decrease]    =       XF86MonBrightnessDown

# QUIRKS
# Default quirks, remove with: quirk[class:name] = NONE
# quirk[MPlayer:xv]			= FLOAT + FULLSCREEN + FOCUSPREV
# quirk[OpenOffice.org 2.4:VCLSalFrame]	= FLOAT
# quirk[OpenOffice.org 3.0:VCLSalFrame]	= FLOAT
# quirk[OpenOffice.org 3.1:VCLSalFrame]	= FLOAT
quirk[Firefox-bin:firefox-bin]		= TRANSSZ + WS[10]
quirk[Firefox:Dialog]			= FLOAT
quirk[brave-browser] 			= TRANSSZ + WS[10]
quirk[qutebrowser] 				= TRANSSZ + WS[10]
quirk[Plank:plank]				= FLOAT + ANYWHERE
quirk[stalonetray:stalonetray]			= FLOAT + ANYWHERE + NOFOCUSCYCLE + NOFOCUSONMAP + OBEYAPPFOCUSREQ
# quirk[Gimp:gimp]			= FLOAT + ANYWHERE
quirk[XTerm:xterm]			= XTERM_FONTADJ
# quirk[xine:Xine Window]			= FLOAT + ANYWHERE
# quirk[Xitk:Xitk Combo]			= FLOAT + ANYWHERE
# quirk[xine:xine Panel]			= FLOAT + ANYWHERE
# quirk[Xitk:Xine Window]			= FLOAT + ANYWHERE
# quirk[xine:xine Video Fullscreen Window] = FULLSCREEN + FLOAT
# quirk[pcb:pcb]				= FLOAT
quirk[mpv]				= FLOAT
quirk["Schnellformatierung Zitation"]           = FLOAT
