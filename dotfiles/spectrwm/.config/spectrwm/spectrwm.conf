# spectrwm configuration file
# This is a minimal example configuration for spectrwm
# Place this file at ~/.config/spectrwm/spectrwm.conf

# Window decoration
border_width            = 1
color_focus             = rgb:88/c0/d0
color_unfocus           = rgb:3c/3c/3c
region_padding          = 5
tile_gap                = 5

# Bar settings
bar_enabled             = 1
bar_border_width        = 1
bar_border[1]           = rgb:28/2a/36
bar_color[1]            = rgb:28/2a/36
bar_font_color[1]       = rgb:f8/f8/f2
bar_font                = terminus:pixelsize=14:antialias=true
bar_action              = ~/.config/spectrwm/baraction.sh
bar_justify             = left
bar_format              = +N:+I +S <+D>+4<%a %b %d %R %Z %Y+8<+A+4<+V
bar_at_bottom           = 0
stack_enabled           = 1
clock_enabled           = 1

# Workspaces
workspace_limit         = 10
name                    = ws[1]:1
name                    = ws[2]:2
name                    = ws[3]:3
name                    = ws[4]:4
name                    = ws[5]:5
name                    = ws[6]:6
name                    = ws[7]:7
name                    = ws[8]:8
name                    = ws[9]:9
name                    = ws[10]:10

# Modkey (Mod1=Alt, Mod4=Super/Windows key)
modkey = Mod4

# Programs
program[term]           = alacritty
program[menu]           = dmenu_run -fn 'terminus:pixelsize=14' -nb '#282a36' -nf '#f8f8f2' -sb '#88c0d0' -sf '#282a36'

# Key bindings
bind[term]              = MOD+Return
bind[menu]              = MOD+d
bind[quit]              = MOD+Shift+q
bind[restart]           = MOD+Shift+r
bind[wind_del]          = MOD+Shift+c
bind[focus_next]        = MOD+j
bind[focus_prev]        = MOD+k
bind[swap_next]         = MOD+Shift+j
bind[swap_prev]         = MOD+Shift+k

# Layout
bind[cycle_layout]      = MOD+space
bind[master_grow]       = MOD+l
bind[master_shrink]     = MOD+h

# Workspace switching
bind[ws_1]              = MOD+1
bind[ws_2]              = MOD+2
bind[ws_3]              = MOD+3
bind[ws_4]              = MOD+4
bind[ws_5]              = MOD+5
bind[ws_6]              = MOD+6
bind[ws_7]              = MOD+7
bind[ws_8]              = MOD+8
bind[ws_9]              = MOD+9
bind[ws_10]             = MOD+0

# Move windows to workspaces
bind[mvws_1]            = MOD+Shift+1
bind[mvws_2]            = MOD+Shift+2
bind[mvws_3]            = MOD+Shift+3
bind[mvws_4]            = MOD+Shift+4
bind[mvws_5]            = MOD+Shift+5
bind[mvws_6]            = MOD+Shift+6
bind[mvws_7]            = MOD+Shift+7
bind[mvws_8]            = MOD+Shift+8
bind[mvws_9]            = MOD+Shift+9
bind[mvws_10]           = MOD+Shift+0
